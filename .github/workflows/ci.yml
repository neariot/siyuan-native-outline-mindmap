name: CI

# When it runs: on every push to main and on every PR.
# E2E needs a kernel with SiYuan running, which a GitHub-hosted runner does not have ——
# so this runs only the **self-contained** layers (see below). There is no E2E job and no manual
# trigger: an E2E job here could not run (see the note at the end of this file).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck / unit tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Offline unit tests run on Node, but the repo scripts are driven by python3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Offline unit tests
        run: npm test

      - name: Verify artifacts (CSS scoping + package contents)
        run: |
          npm run package

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package.zip

  # ── E2E is deliberately NOT a job here ──────────────────────────────────────────────────────────
  #
  # It used to be one (`if: workflow_dispatch && inputs.e2e`, `runs-on: ubuntu-latest`), and it could
  # never run:
  #
  #   · a GitHub-hosted runner has no SiYuan kernel, which the job's own comment admitted —— so the
  #     steps it fed (`npm run deploy`, `npm run test:e2e`) had nothing to talk to;
  #   · `scripts/run-e2e.py` takes its target from `.env` (`cfg.siyuan_test`), and the workflow never
  #     creates one —— it exported `SIYUAN_URL` / `SIYUAN_TOKEN` as step env, which the entry point
  #     **overwrites** from that file. Two repository secrets were wired to nothing;
  #   · `scripts/deploy.py` reads its targets from `PLUGIN_DIRS` in `.env` too, so the deploy step had
  #     no target either.
  #
  # A job that cannot run is worse than no job: it reads as coverage, it holds credentials that do
  # nothing, and a manual trigger that fails at the first step teaches people to ignore the run.
  # E2E is run on a machine that has SiYuan, via `python3 scripts/run-e2e.py <suite>` (see
  # docs/TESTING.md §④); there is nothing for CI to add here.
